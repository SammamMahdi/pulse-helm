# Local multi-node cluster: 1 control plane + 2 workers.
# NodePort 30080 is published on 127.0.0.1 only, so the lab is not reachable from the network.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pulse-lab
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
  - role: worker
