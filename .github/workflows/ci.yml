name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KUBECONFORM_VERSION: v0.8.0

jobs:
  static:
    name: Chart lint, schema and policy checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
      - name: Install kubeconform (checksum verified)
        run: |
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -fsSLO "$base/kubeconform-linux-amd64.tar.gz"
          curl -fsSLO "$base/CHECKSUMS"
          grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
      - name: Shellcheck
        run: shellcheck scripts/*.sh
      - name: Lint, render, kubeconform, trivy, rejected-values checks
        run: scripts/validate-chart.sh

  kind:
    name: Install on kind and run helm test
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SammamMahdi/pulse
          path: pulse
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: pulse-lab
          config: kind/cluster.yaml
      - name: Build and load the image
        run: |
          docker build -q --build-arg APP_VERSION=1.0.0 -t pulse-api:1.0.0 pulse
          kind load docker-image pulse-api:1.0.0 --name pulse-lab
      - name: Install the chart
        run: |
          helm upgrade --install pulse charts/pulse -n pulse --create-namespace \
            -f charts/pulse/values-dev.yaml --set image.tag=1.0.0 --wait --timeout 180s
      - name: helm test
        run: helm test pulse -n pulse --logs
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n pulse get all -o wide || true
          kubectl -n pulse describe pods || true
          kubectl -n pulse get events --sort-by=.lastTimestamp || true
