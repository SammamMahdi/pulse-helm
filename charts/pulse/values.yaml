# Defaults are secure and environment-neutral; values-dev.yaml / values-prod.yaml override them.

replicaCount: 2

image:
  repository: ghcr.io/sammammahdi/pulse-api
  # Set a tag (e.g. 1.0.0) or, preferably for production, an immutable digest (sha256:...).
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Non-secret settings rendered into a ConfigMap and loaded with envFrom.
config:
  APP_ENV: default
  LOG_LEVEL: INFO
  MAX_PRIME_LIMIT: "1000000"

# Lab-only fault injection. The admin token is NEVER stored in values: it is read from an
# existing Secret (created out-of-band, e.g. kubectl, External Secrets or the Key Vault CSI driver).
faultInjection:
  enabled: false
  existingSecret: ""
  secretKey: admin-token

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  port: 80
  nodePort: null

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: pulse.local
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  readiness:
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    periodSeconds: 10
    failureThreshold: 3
  startup:
    periodSeconds: 2
    failureThreshold: 15

# Gives endpoints time to drop the pod before the process receives SIGTERM.
preStopSleepSeconds: 5
terminationGracePeriodSeconds: 30

strategy:
  maxSurge: 1
  maxUnavailable: 0

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  enabled: false
  # Extra NetworkPolicyPeer entries allowed to reach the pods (e.g. ingress controller, Prometheus).
  extraIngressFrom: []

nodeSelector: {}
tolerations: []
affinity: {}
