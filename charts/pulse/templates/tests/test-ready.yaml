# `helm test <release>`: calls the Service from inside the cluster, using the app image itself
# (it has Python), so no extra test image has to be pulled or trusted.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "pulse.fullname" . }}-test-ready
  labels:
    {{- include "pulse.labels" . | nindent 4 }}
    {{ include "pulse.fullname" . }}-client: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: check
      image: {{ include "pulse.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      command:
        - python
        - -c
        - |
          import json, urllib.request
          base = "http://{{ include "pulse.fullname" . }}:{{ .Values.service.port }}"
          assert urllib.request.urlopen(base + "/ready", timeout=5).status == 200
          body = json.load(urllib.request.urlopen(base + "/api/v1/primes/100", timeout=5))
          assert body["prime_count"] == 25, body
          print("helm test passed:", body)
      resources:
        limits: { cpu: 100m, memory: 64Mi }
